name: Verify YouSong

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/song-request-upload-waiting-room]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
