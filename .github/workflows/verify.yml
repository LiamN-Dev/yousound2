name: Verify YouSong

on:
  push:
    branches:
      - 'feature/**'
      - fix/song-admin-thumbnails-christmas-radio-reliability
      - fix-radio-sync-pipeline-moderation
      - feature/community-arcade-admin-operator-nov-2026
  pull_request:
    branches: [main, fix/multi-radio-ai-safety-crossy-nov-2026]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
